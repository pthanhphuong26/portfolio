name: Portfolio CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: 1. Validate and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Run project checks
        run: npm run check

      - name: Validate cPanel deployment script
        run: bash -n scripts/deploy-cpanel.sh

      - name: Package cPanel release
        if: github.event_name != 'pull_request' && vars.CPANEL_DEPLOY_ENABLED == 'true'
        shell: bash
        run: tar -czf "portfolio-${GITHUB_SHA}.tar.gz" -C dist .

      - name: Upload cPanel release
        if: github.event_name != 'pull_request' && vars.CPANEL_DEPLOY_ENABLED == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: portfolio-production-${{ github.sha }}
          path: portfolio-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy-production:
    name: 2. Deploy to cPanel
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.CPANEL_DEPLOY_ENABLED == 'true'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    concurrency:
      group: portfolio-production
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate deployment configuration
        shell: bash
        env:
          CPANEL_APP_ROOT: ${{ vars.CPANEL_APP_ROOT }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          test -n "$CPANEL_APP_ROOT" || { echo "CPANEL_APP_ROOT is required." >&2; exit 1; }
          test -n "$CPANEL_HOST" || { echo "CPANEL_HOST is required." >&2; exit 1; }
          test -n "$CPANEL_KNOWN_HOSTS" || { echo "CPANEL_KNOWN_HOSTS is required." >&2; exit 1; }
          test -n "$CPANEL_SSH_PRIVATE_KEY" || { echo "CPANEL_SSH_PRIVATE_KEY is required." >&2; exit 1; }
          test -n "$CPANEL_USER" || { echo "CPANEL_USER is required." >&2; exit 1; }
          test -n "$PRODUCTION_URL" || { echo "PRODUCTION_URL is required." >&2; exit 1; }

      - name: Download cPanel release
        uses: actions/download-artifact@v7
        with:
          name: portfolio-production-${{ github.sha }}
          path: .release

      - name: Configure deployment SSH key
        shell: bash
        env:
          CPANEL_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$CPANEL_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Activate cPanel release
        shell: bash
        env:
          CPANEL_APP_ROOT: ${{ vars.CPANEL_APP_ROOT }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_SSH_PORT: ${{ vars.CPANEL_SSH_PORT || '22' }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
        run: bash scripts/deploy-cpanel.sh ".release/portfolio-${GITHUB_SHA}.tar.gz"

      - name: Verify production website
        shell: bash
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          page="$(curl --location --proto '=https' --proto-redir '=https' --max-redirs 3 --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 --max-time 20 "${PRODUCTION_URL%/}/")"
          grep -Fq '<title>Pham Thanh Phuong — Software Engineer Portfolio</title>' <<< "$page"
